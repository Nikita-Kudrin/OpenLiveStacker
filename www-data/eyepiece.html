<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="/media/img/facicon.png">
    <title>OpenLiveStacker Eyepiece</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            overflow: hidden;
        }

        #container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .eye-container {
            position: absolute;
            overflow: hidden;
            border-radius: 50%;
        }

        .eye-container.debug {
            border: 5px solid red; /* DEBUG: red ring to visualize positioning of the eyepiece circle */
        }

        .eye-container.rect {
            border-radius: 0;
        }

        .eye-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #controls {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            z-index: 100;
            display: none;
            border: 1px solid #444;
        }

        #controls div {
            margin-bottom: 10px;
        }

        #controls button {
            margin-right: 5px;
            min-width: 25mm;
        }

        button {
            border-radius: 2mm;
            height: 10mm;
            font-size: 4mm;
            text-align: center;
            vertical-align: middle;
            background-color: black;
            color: red;
            border: 2px solid red;
            cursor: pointer;
        }

        button.active {
            background-color: red;
            color: black;
        }
    </style>
</head>
<body onclick="toggleControls(event)">
<div id="container"></div>

<div id="controls" onclick="event.stopPropagation()">
    <div style="text-align: right;"><button onclick="toggleControls(event)" style="min-width: 10mm;">X</button></div>
    <div>
        <span style="color: white;">View:</span>
        <button id="btn-bino-single" onclick="cycleBino()">Single</button>
    </div>
    <div>
        <span style="color: white;">Scaling:</span>
        <button id="btn-fit-fill" onclick="cycleFit()">Fill</button>
    </div>
    <div>
        <span style="color: white;">Shape:</span>
        <button id="btn-mask" onclick="cycleMask()">Circle</button>
    </div>
</div>

<script>
    /** Debug logging is set in ./build/config.json
     * "ols_data": { "debug_log": true, } */
    var debugEnabled = false;

    function debugLog() {
        if (debugEnabled) {
            console.log.apply(console, arguments);
        }
    }

    function restCall(method, url, request, on_response) {
        var xhr = new XMLHttpRequest();
        xhr.open(method, url, true);
        xhr.timeout = 5000;
        xhr.onload = function () {
            if (xhr.status >= 200 && xhr.status < 300) {
                try {
                    var response = JSON.parse(xhr.responseText);
                    if (response.status === 'fail') {
                        console.error("API error on " + url, response.error);
                        on_response(null);
                    } else {
                        on_response(response);
                    }
                } catch (e) {
                    console.error("Failed to parse response from " + url, e);
                    on_response(null);
                }
            } else {
                console.error("HTTP error on " + url, xhr.status);
                on_response(null);
            }
        };
        xhr.onerror = function () {
            console.error("Network error on " + url);
            on_response(null);
        };
        xhr.ontimeout = function () {
            console.error("Timeout on " + url);
            on_response(null);
        };
        if (request) {
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.send(JSON.stringify(request));
        } else {
            xhr.send();
        }
    }

    var current_binoviewers = null;
    var current_ipd = null;
    var current_ipd_gap = null;
    var current_stream = null;
    var current_debug = null;
    var current_width = null;
    var current_height = null;
    var current_fps_limit = 1;

    var local_bino_mode = localStorage.getItem('ols_eyepiece_bino') || 'auto'; // 'auto', 'single', 'bino'
    var local_fit_mode = localStorage.getItem('ols_eyepiece_fit') || 'fill'; // 'fit', 'fill'
    var local_mask_mode = localStorage.getItem('ols_eyepiece_mask') || 'circle'; // 'circle', 'rect'

    function toggleControls(e) {
        var ctrl = document.getElementById('controls');
        if (ctrl.style.display === 'block') {
            ctrl.style.display = 'none';
        } else {
            ctrl.style.display = 'block';
            updateControlUI();
        }
    }

    function updateControlUI() {
        document.getElementById('btn-bino-single').innerText = local_bino_mode.toUpperCase();
        document.getElementById('btn-fit-fill').innerText = local_fit_mode.toUpperCase();
        document.getElementById('btn-mask').innerText = local_mask_mode.toUpperCase();
    }

    function cycleBino() {
        if (local_bino_mode === 'auto') local_bino_mode = 'single';
        else if (local_bino_mode === 'single') local_bino_mode = 'bino';
        else local_bino_mode = 'auto';
        localStorage.setItem('ols_eyepiece_bino', local_bino_mode);
        updateControlUI();
        applyLayout();
    }

    function cycleFit() {
        local_fit_mode = (local_fit_mode === 'fill' ? 'fit' : 'fill');
        localStorage.setItem('ols_eyepiece_fit', local_fit_mode);
        updateControlUI();
        render('fit_change');
    }

    function cycleMask() {
        local_mask_mode = (local_mask_mode === 'circle' ? 'rect' : 'circle');
        localStorage.setItem('ols_eyepiece_mask', local_mask_mode);
        updateControlUI();
        applyLayout();
    }

    var updateLayoutTimeout = null;
    var last_status_data = null;
    var last_config_data = null;
    var streamImage = new Image();

    function drawToCanvas(canvas, img) {
        debugLog('drawToCanvas', canvas, img.src);
        if (!img.complete || img.naturalWidth === 0) return;

        var eye = canvas.dataset.eye;
        var config = (last_config_data && last_config_data.value) || {};
        var is3D = config.stack_enable_midas_3d === true || config.stack_enable_midas_3d === 'true' || 
                   config.enable_midas_3d === true || config.enable_midas_3d === 'true';

        var iw = img.naturalWidth;
        var ih = img.naturalHeight;

        // Auto-detect SBS if image is exceptionally wide
        if (!is3D && iw > ih * 2.4) {
            is3D = true;
        }

        var rect = canvas.getBoundingClientRect();
        var cw = Math.floor(rect.width);
        var ch = Math.floor(rect.height);
        if (cw === 0 || ch === 0) return;

        if (canvas.width !== cw || canvas.height !== ch) {
            canvas.width = cw;
            canvas.height = ch;
        }

        var ctx = canvas.getContext('2d');
        var sx, sy, sw, sh;

        if (is3D) {
            // SBS: Image has two halves
            var halfWidth = iw / 2;
            if (eye === 'left') {
                sx = 0;
            } else if (eye === 'right') {
                sx = halfWidth;
            } else {
                sx = 0; // fallback
            }
            iw = halfWidth;
        } else {
            sx = 0;
        }

        var iRatio = iw / ih;
        var cRatio = cw / ch;

        ctx.fillStyle = 'black';
        ctx.fillRect(0, 0, cw, ch);

        if (local_fit_mode === 'fill') {
            if (iRatio > cRatio) {
                sh = ih;
                sw = ih * cRatio;
                sx += (iw - sw) / 2;
                sy = 0;
            } else {
                sw = iw;
                sh = iw / cRatio;
                sy = (ih - sh) / 2;
            }
            ctx.drawImage(img, sx, sy, sw, sh, 0, 0, cw, ch);
        } else {
            // fit mode
            var dx, dy, dw, dh;
            if (iRatio > cRatio) {
                dw = cw;
                dh = cw / iRatio;
                dx = 0;
                dy = (ch - dh) / 2;
            } else {
                dh = ch;
                dw = ch * iRatio;
                dy = 0;
                dx = (cw - dw) / 2;
            }
            ctx.drawImage(img, sx, 0, iw, ih, dx, dy, dw, dh);
        }
    }


    var updated_last = null;

    function render(reason) {
        debugLog('render', reason);
        var canvases = document.getElementsByClassName('eye-canvas');
        for (var i = 0; i < canvases.length; i++) {
            drawToCanvas(canvases[i], streamImage);
        }
        updated_last = Date.now();
    }

    function animationLoop() {
        var curr_time = Date.now();
        var fps_limit = parseFloat(current_fps_limit) || 1;
        var delay_ms = 1000 / fps_limit;
        // Redraw at fps_limit as fallback for browsers not triggering onload on MJPEG
        if (updated_last == null || curr_time - updated_last > delay_ms) {
            render('loop');
        }
        requestAnimationFrame(animationLoop);
    }

    function applyLayout() {
        if (!last_config_data) return;
        var statusData = last_status_data;
        var data = last_config_data;

        var stream = (statusData && statusData.status !== 'idle') ? 'stacked' : 'live';
        var config = (data && data.value) || {};
        // Handle both boolean and string values for binoviewers
        var binoviewers;
        if (local_bino_mode === 'single') binoviewers = false;
        else if (local_bino_mode === 'bino') binoviewers = true;
        else binoviewers = config.enable_binoviewers === true || config.enable_binoviewers === 'true';

        var ipd_mm = parseFloat(config.ipd_mm) || 60;
        var ipd_gap_mm = parseFloat(config.ipd_gap_mm) || 10;
        var width_mm = parseFloat(config.screen_width_mm) || 140;

        var fps_limit = parseFloat(config.eyepiece_fps_limit) || 1;
        if (fps_limit <= 0) fps_limit = 1;
        if (fps_limit > 60) fps_limit = 60; // Cap at 60 FPS to prevent unnecessary power drain

        var screenWidth = window.innerWidth;
        var screenHeight = window.innerHeight;
        var ipd = ipd_mm / width_mm * screenWidth;
        var ipd_gap = ipd_gap_mm / width_mm * screenWidth;

        // Read debug_log from ols_data config
        debugEnabled = (config.debug_log === true || config.debug_log === 'true') || false;

        if (stream !== current_stream) {
            streamImage.src = '/api/video/' + stream;
        }


        if (binoviewers === current_binoviewers && ipd === current_ipd && ipd_gap == current_ipd_gap && stream === current_stream && debugEnabled === current_debug &&
            screenWidth === current_width && screenHeight === current_height && fps_limit === current_fps_limit) {
            return;
        }

        current_binoviewers = binoviewers;
        current_ipd = ipd;
        current_ipd_gap = ipd_gap;
        current_stream = stream;
        current_debug = debugEnabled;
        current_width = screenWidth;
        current_height = screenHeight;
        current_fps_limit = fps_limit;

        var container = document.getElementById('container');
        container.innerHTML = '';

        if (!binoviewers) {
            debugLog('Creating single eye layout');
            var eye = createEye('single');
            if (local_mask_mode === 'rect') {
                eye.style.width = '100vw';
                eye.style.height = '100vh';
            } else {
                var size = 'min(98vw, 98vh)';
                eye.style.width = size;
                eye.style.height = size;
            }
            eye.style.top = '50%';
            eye.style.left = '50%';
            eye.style.transform = 'translate(-50%, -50%)';
            container.appendChild(eye);
        } else {
            debugLog('Creating binoviewers layout with IPD (px):', ipd);
            var leftEye = createEye('left');
            var rightEye = createEye('right');

            // Constraint 1: Circles must not intersect
            // Distance between centers = ipdPx, so radius must be <= ipdPx/2
            var maxRadiusNoIntersect = ipd / 2 - ipd_gap / 2;

            // Constraint 2: Circles must not overflow screen edges
            // Left circle: center at (screenWidth/2 - ipdPx/2), must fit: radius <= screenWidth/2 - ipdPx/2
            // Right circle: center at (screenWidth/2 + ipdPx/2), must fit: radius <= screenWidth/2 - ipdPx/2
            var maxRadiusForScreenWidth = (screenWidth / 2) - (ipd / 2);

            // Constraint 3: Height constraint
            var maxRadiusForHeight = screenHeight / 2;

            // Use the smallest constraint with 2% margin
            var radius = Math.min(maxRadiusNoIntersect, maxRadiusForScreenWidth, maxRadiusForHeight) * 0.98;
            var diameter = radius * 2;

            debugLog('Screen:', screenWidth, 'x', screenHeight, 'IPD px:', ipd);
            debugLog('Max radius - no intersect:', maxRadiusNoIntersect, 'screen width:', maxRadiusForScreenWidth, 'height:', maxRadiusForHeight);
            debugLog('Final radius:', radius);

            if (local_mask_mode === 'rect') {
                // For rect bino, we use ipd as width and screenHeight as height
                leftEye.style.width = ipd + 'px';
                leftEye.style.height = screenHeight + 'px';
                rightEye.style.width = ipd + 'px';
                rightEye.style.height = screenHeight + 'px';
            } else {
                leftEye.style.width = diameter + 'px';
                leftEye.style.height = diameter + 'px';
                rightEye.style.width = diameter + 'px';
                rightEye.style.height = diameter + 'px';
            }

            leftEye.style.top = '50%';
            leftEye.style.left = 'calc(50% - ' + (ipd / 2) + 'px)';
            leftEye.style.transform = 'translate(-50%, -50%)';

            rightEye.style.top = '50%';
            rightEye.style.left = 'calc(50% + ' + (ipd / 2) + 'px)';
            rightEye.style.transform = 'translate(-50%, -50%)';

            container.appendChild(leftEye);
            container.appendChild(rightEye);
        }
        render('layout_applied');
    }

    function isInIframe() {
        var url = window.location.href;
        var queryPos = url.indexOf('?');
        if (queryPos == -1)
            return false;
        var params = url.slice(queryPos + 1);
        if (params == 'if')
            return true;
        return false;
    }

    function updateLayout() {
        if (isInIframe()) {
            var b = document.getElementById('toggle_button');
            if (b)
                b.remove();
        }
        if (updateLayoutTimeout) {
            clearTimeout(updateLayoutTimeout);
            updateLayoutTimeout = null;
        }
        restCall('get', '/api/stacker/status', null, function (statusData) {
            restCall('get', '/api/config/ols_data', null, function (data) {
                last_status_data = statusData;
                last_config_data = data;
                applyLayout();
                updateLayoutTimeout = setTimeout(updateLayout, 2000);
            });
        });
    }

    function createEye(id) {
        var div = document.createElement('div');
        div.className = 'eye-container';
        if (debugEnabled) div.classList.add('debug');
        if (local_mask_mode === 'rect') div.classList.add('rect');
        var canvas = document.createElement('canvas');
        canvas.className = 'eye-canvas';
        canvas.dataset.eye = id;
        div.appendChild(canvas);
        return div;
    }

    window.onload = function () {
        updateLayout();
        streamImage.onload = function () {
            render('new_frame');
        };
        animationLoop();
    };

    var resizeTimeout = null;
    window.onresize = function () {
        if (resizeTimeout) clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(function () {
            applyLayout();
        }, 100);
    };
    var current_full_screen = false;
    var wakeLock = null;

    async function toggleSWL(swl) {
        try {
            if (swl) {
                wakeLock = await navigator.wakeLock.request('screen');
            } else if (wakeLock) {
                await wakeLock.release();
                wakeLock = null;
            }
        } catch (err) {
            console.error(`${err.name}, ${err.message}`);
        }
    }

    function toggleFS() {
        current_full_screen = !current_full_screen;
        if (current_full_screen) {
            document.documentElement.requestFullscreen({navigationUI: 'hide'});
        } else {
            document.exitFullscreen();
        }
        toggleSWL(current_full_screen);
    }
</script>
<span id="toggle_button" style="position:absolute; left:1mm; top:1mm; z-index:5;">
    <button onclick="toggleFS();">FS</button>
</span>

</body>
</html>
